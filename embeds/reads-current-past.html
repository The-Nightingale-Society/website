<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ns-plum: #3E2A45; --ns-parchment: #EDE0C8; --ns-rust: #CB9C6E;
    --ns-sand: #D8C0A0; --ns-brown: #2A1E18;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Lora', serif; background: var(--ns-parchment); color: var(--ns-brown); }
  section { padding: 4rem 6vw; }
  h2 {
    font-family: 'Playfair Display', serif;
    text-align: center;
    color: var(--ns-plum);
    font-size: clamp(1.5rem, 3vw, 2.1rem);
    margin: 0 0 2.5rem;
  }

  .current {
    max-width: 820px;
    margin: 0 auto 4rem;
    background: var(--ns-plum);
    color: var(--ns-parchment);
    border-radius: 18px;
    display: flex;
    gap: 2rem;
    align-items: center;
    padding: 2.25rem;
    flex-wrap: wrap;
  }
  .current__cover {
    width: 130px;
    height: 190px;
    flex-shrink: 0;
    background: var(--ns-sand);
    border-radius: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--ns-plum);
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    text-align: center;
    padding: 0.5rem;
  }
  .current__cover img, .archive__cover img { width: 100%; height: 100%; object-fit: cover; }
  .current__body { flex: 1; min-width: 220px; }
  .current__kicker {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 0.75rem;
    color: var(--ns-sand);
    font-style: italic;
  }
  .current__title { font-family: 'Playfair Display', serif; font-size: 1.55rem; margin: 0.4rem 0 0.1rem; }
  .current__author { color: var(--ns-sand); margin: 0 0 0.9rem; font-style: italic; }
  .current__synopsis { line-height: 1.65; font-size: 0.98rem; margin: 0 0 1rem; }
  .current__date {
    display: inline-block;
    border: 1px solid var(--ns-sand);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    font-size: 0.85rem;
  }

  .archive__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .archive__item { text-align: center; }
  .archive__cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #fff;
    border: 1px solid rgba(62,42,69,0.15);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--ns-plum);
    font-family: 'Playfair Display', serif;
    font-size: 0.8rem;
    padding: 0.6rem;
    box-shadow: 0 4px 12px rgba(42,30,24,0.08);
    margin-bottom: 0.6rem;
  }
  .archive__title { font-weight: 600; font-size: 0.92rem; margin: 0; color: var(--ns-plum); }
  .archive__meta { font-size: 0.8rem; color: var(--ns-rust); margin: 0.2rem 0 0; font-style: italic; }
</style>
</head>
<body>

<section>
  <h2>Currently Reading</h2>
  <div class="current" id="currentRead"></div>

  <h2>Past Reads</h2>
  <div class="archive__grid" id="archiveGrid"></div>
</section>

<script>
  // ---- Live source: Google Sheet ----
  // This page pulls Currently Reading / Past Reads from the "Reads" tab of
  // this Google Sheet on every page load, so editing the sheet updates the
  // live site with no re-paste needed. The sheet must stay shared as
  // "Anyone with the link — Viewer" or the fetch below will fail (silently
  // falling back to FALLBACK_* below). See the sheet's "Read Me" tab for
  // the editing format.
  const SHEET_ID = "1pULfn9fQH4S8YiucXL0LiDyVxicLmAZ95svPWh9MDDk";
  const SHEET_TAB = "Reads";
  const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
  const FETCH_TIMEOUT_MS = 6000;

  // Used only if the live sheet can't be reached (offline preview, or the
  // fetch gets blocked inside the Google Sites embed sandbox).
  const FALLBACK_CURRENT = {
    title: "Project Hail Mary",
    author: "Andy Weir",
    synopsis: "A lone astronaut wakes up on a solitary space mission with no memory of how he got there, or that the fate of humanity rests on whether he can solve the problem he was sent to fix.",
    date: "[Date]",
    cover: "../assets/covers/project-hail-mary.png",
  };
  const FALLBACK_PAST_READS = [
    { title: "Murder on the Orient Express", author: "Agatha Christie", month: "July 2026", cover: "../assets/covers/murder-orient-express.png" },
  ];

  // Accepts a plain image URL, OR a Google Drive "share" link pasted
  // straight from Drive's Share button — converts the Drive link into a
  // direct-viewable image URL automatically so nobody has to hand-build one.
  function coverUrl(u) {
    if (!u) return "";
    const m = u.match(/\/file\/d\/([^/]+)/) || u.match(/[?&]id=([^&]+)/);
    return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : u;
  }

  // Minimal RFC 4180 CSV parser — handles quoted fields, embedded commas,
  // escaped quotes ("") and newlines inside quotes, which is what the
  // Google Sheets CSV export produces.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\r') {
        // skip, \n below ends the row
      } else if (c === '\n') {
        row.push(field); field = "";
        rows.push(row); row = [];
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ""));
  }

  function rowsToReads(csvText) {
    const rows = parseCSV(csvText);
    const [header, ...body] = rows;
    const idx = name => header.findIndex(h => h.trim().toLowerCase() === name);
    const iStatus = idx("status"), iTitle = idx("title"), iAuthor = idx("author"),
          iSynopsis = idx("synopsis"), iDate = idx("discussion date / month"), iCover = idx("cover");

    let current = null;
    const pastReads = [];
    for (const r of body) {
      const status = (r[iStatus] || "").trim().toLowerCase();
      const entry = {
        title: r[iTitle] || "",
        author: r[iAuthor] || "",
        synopsis: r[iSynopsis] || "",
        date: r[iDate] || "",
        month: r[iDate] || "",
        cover: r[iCover] || "",
      };
      if (status === "current" && !current) current = entry;
      else if (status === "past") pastReads.push(entry);
    }
    if (!current) throw new Error("No row with Status = Current found in sheet");
    return { current, pastReads };
  }

  function renderCurrent(currentRead) {
    document.getElementById('currentRead').innerHTML = `
      <div class="current__cover">${currentRead.cover ? `<img src="${coverUrl(currentRead.cover)}" alt="${currentRead.title} cover">` : `${currentRead.title}`}</div>
      <div class="current__body">
        <div class="current__kicker">This Month's Pick</div>
        <h3 class="current__title">${currentRead.title}</h3>
        <p class="current__author">by ${currentRead.author}</p>
        <p class="current__synopsis">${currentRead.synopsis}</p>
        <span class="current__date">Discussion: ${currentRead.date}</span>
      </div>
    `;
  }

  function renderPastReads(pastReads) {
    document.getElementById('archiveGrid').innerHTML = pastReads.map(b => `
      <div class="archive__item">
        <div class="archive__cover">${b.cover ? `<img src="${coverUrl(b.cover)}" alt="${b.title} cover">` : b.title}</div>
        <p class="archive__title">${b.title}</p>
        <p class="archive__meta">${b.month}</p>
      </div>
    `).join('');
  }

  function renderAll(currentRead, pastReads) {
    renderCurrent(currentRead);
    renderPastReads(pastReads);
  }

  // Render the fallback immediately so the page is never blank, then
  // replace it with live sheet data as soon as (if) it arrives.
  renderAll(FALLBACK_CURRENT, FALLBACK_PAST_READS);

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  fetch(SHEET_CSV_URL, { signal: controller.signal, cache: "no-store" })
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(csvText => {
      const { current, pastReads } = rowsToReads(csvText);
      renderAll(current, pastReads);
    })
    .catch(err => {
      console.warn("Nightingale: couldn't load live Reads sheet, showing fallback content.", err);
    })
    .finally(() => clearTimeout(timeout));
</script>

<script>
  // Reports this page's real height to a parent window — used by the local
  // preview.html to auto-size its iframe so content never gets clipped.
  // Harmless no-op inside Google Sites, which doesn't listen for this.
  new ResizeObserver(() => {
    window.parent.postMessage({ nsHeight: document.documentElement.scrollHeight }, '*');
  }).observe(document.documentElement);
</script>

</body>
</html>
